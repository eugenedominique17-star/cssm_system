<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>/* =========================================================
   StoreHub — Refined Global UI Theme
   Compatible with MUI sx-based components.
   Avoids global !important rules that can override component sx.
   ========================================================= */

:root {
  color-scheme: light;
  --sh-glass-bg: rgba(255, 253, 245, 0.68);
  --sh-glass-raised: rgba(250, 252, 242, 0.94);
  --sh-page-tint: rgba(247, 245, 236, 0.32);
  /* Brand */
  --sh-primary-950: #043525;
  --sh-primary-900: #06432F;
  --sh-primary-800: #07543E;
  --sh-primary-700: #066649;
  --sh-primary-600: #087F5B;
  --sh-primary-500: #27AE80;
  --sh-primary-400: #8EDDB8;
  --sh-primary-300: #B9EBD0;
  --sh-primary-200: #C8EED9;
  --sh-primary-100: #D8F3E5;
  --sh-primary-50: #EFF9F1;

  /* Neutral */
  --sh-ink: #183D32;
  --sh-text: #365C4B;
  --sh-muted: #617B6C;
  --sh-soft: #839B8C;
  --sh-line: #D5E5D9;
  --sh-line-soft: #E6EFE4;
  --sh-surface: var(--sh-glass-bg);
  --sh-bg: #F7F5EC;

  /* Status */
  --sh-success: #087F5B;
  --sh-warning: #d97706;
  --sh-danger: #dc2626;
  --sh-info: #2563eb;

  /* Shape */
  --sh-radius-xs: 8px;
  --sh-radius-sm: 10px;
  --sh-radius-md: 14px;
  --sh-radius-lg: 18px;
  --sh-radius-xl: 24px;
  --sh-radius-2xl: 28px;

  /* Elevation */
  --sh-shadow-xs: 0 2px 8px rgba(24,61,50, 0.04);
  --sh-shadow-sm: 0 5px 16px rgba(24,61,50, 0.06);
  --sh-shadow-md: 0 12px 30px rgba(24,61,50, 0.09);
  --sh-shadow-lg: 0 22px 55px rgba(24,61,50, 0.14);

  /* Motion */
  --sh-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --sh-fast: 160ms;
  --sh-normal: 260ms;

  /* Typography */
  --sh-font:
    "Plus Jakarta Sans",
    "Poppins",
    "Segoe UI",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
}

/* ===== Reset ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

* {
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  background: var(--sh-bg);
}

body {
  min-width: 320px;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: var(--sh-font);
  background:
    radial-gradient(ellipse at 0% 8%, rgba(142,221,184, 0.55), transparent 48%),
    radial-gradient(ellipse at 95% 42%, rgba(185,235,208, 0.6), transparent 48%),
    radial-gradient(ellipse at 45% 100%, rgba(233,220,178, 0.35), transparent 50%),
    var(--sh-bg);
  background-attachment: fixed;
  color: var(--sh-ink);
  font-size: 1rem;
  line-height: 1.6;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#root {
  min-height: 100vh;
  isolation: isolate;
}

#root::before {
  content: "";
  position: fixed;
  inset: -12%;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse at 15% 20%, rgba(142,221,184,.32), transparent 48%),
    radial-gradient(ellipse at 85% 75%, rgba(216,243,229,.65), transparent 45%);
  animation: auroraDrift 22s ease-in-out infinite alternate;
}

@keyframes auroraDrift {
  to { transform: translate3d(3%, -2%, 0) scale(1.06); }
}

.dashboard-welcome {
  position: relative;
  overflow: hidden;
  margin-bottom: 24px;
  padding: clamp(22px, 3vw, 36px);
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 26px;
  background: linear-gradient(115deg, rgba(255,253,245,.84), rgba(216,243,229,.7));
  box-shadow: 0 12px 36px rgba(24,61,50,.05);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.welcome-store {
  position: relative;
  width: 128px;
  height: 128px;
  place-items: center;
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 38px;
  background: linear-gradient(145deg, rgba(255,255,255,.75), rgba(142,221,184,.45));
  box-shadow: 0 14px 30px rgba(8,127,91,.10);
  transform: rotate(-6deg);
}

.welcome-store-dot {
  position: absolute;
  width: 24px;
  height: 24px;
  right: -7px;
  top: 10px;
  border-radius: 50%;
  border: 5px solid #F7F5EC;
  background: #27AE80;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.dashboard-content { animation: fadeInUp 350ms var(--sh-ease) both; }

@media print {
  #root::before, .dashboard-welcome { display: none; }
}

img,
svg,
video,
canvas {
  max-width: 100%;
}

img {
  display: block;
}

button,
input,
textarea,
select {
  font: inherit;
}

button,
a,
[role="button"] {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  color: var(--sh-primary-950);
  background: var(--sh-primary-200);
}

/* Keep keyboard focus visible without fighting MUI */
:where(a, button, input, textarea, select, [tabindex]):focus-visible {
  outline: 3px solid rgba(142,221,184, 0.45);
  outline-offset: 3px;
}

/* Smooth anchor scrolling below a fixed header */
#products-section,
[id] {
  scroll-margin-top: 84px;
}

/* ===== Scrollbar ===== */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--sh-primary-500) #EDEFE3;
}

::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}

::-webkit-scrollbar-track {
  background: #EDEFE3;
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(
    135deg,
    var(--sh-primary-700),
    var(--sh-primary-400)
  );
  border: 2px solid #EDEFE3;
  border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(
    135deg,
    var(--sh-primary-800),
    var(--sh-primary-600)
  );
}

/* ===== Page Layout ===== */
.page-container {
  width: min(100%, 1480px);
  min-height: calc(100vh - 124px);
  margin-inline: auto;
  padding: clamp(20px, 3vw, 36px) clamp(16px, 3vw, 32px);
  animation: fadeInUp 0.45s var(--sh-ease) both;
}

.page-title {
  position: relative;
  width: fit-content;
  margin-bottom: 26px;
  padding-bottom: 11px;
  color: var(--sh-ink);
  font-size: clamp(1.55rem, 2vw, 2rem);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.25;
}

.page-title::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 54px;
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(
    90deg,
    var(--sh-primary-600),
    var(--sh-primary-300)
  );
  box-shadow: 0 4px 12px rgba(8,127,91, 0.22);
}

/* ===== Shared Surfaces ===== */
.card,
.chart-container,
.login-container,
.table-container {
  background: var(--sh-glass-bg);
  border: 1px solid rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(18px) saturate(125%);
  -webkit-backdrop-filter: blur(18px) saturate(125%);
  box-shadow: var(--sh-shadow-sm);
}

.card {
  margin-bottom: 18px;
  padding: clamp(18px, 2vw, 26px);
  border-radius: var(--sh-radius-lg);
  transition:
    transform var(--sh-normal) var(--sh-ease),
    box-shadow var(--sh-normal) var(--sh-ease),
    border-color var(--sh-normal) ease;
}

@media (hover: hover) {
  .card:hover {
    transform: translateY(-3px);
    border-color: rgba(8,127,91, 0.2);
    box-shadow: var(--sh-shadow-md);
  }
}

/* ===== Stat Cards ===== */
.stat-card {
  display: block;
}

.stat-card .stat-value {
  margin: 8px 0;
  color: var(--sh-ink);
  font-size: clamp(2rem, 3vw, 2.5rem);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 1.05;
}

.stat-card .stat-label {
  color: var(--sh-muted);
  font-size: 0.92rem;
  font-weight: 650;
  letter-spacing: 0.01em;
}

/* ===== Dashboard Hero ===== */
.dashboard-hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  margin-bottom: 26px;
  padding: clamp(24px, 4vw, 38px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--sh-radius-xl);
  color: #fff;
  box-shadow: 0 20px 48px rgba(2, 6, 23, 0.12);
}

.dashboard-hero::before {
  content: "";
  position: absolute;
  z-index: -1;
  right: -5rem;
  bottom: -8rem;
  width: 20rem;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(185,235,208, 0.2),
    transparent 68%
  );
}

/* ===== Legacy Homepage Banner =====
   Kept for older pages. Your newer Homepage.jsx mostly uses MUI sx.
   ================================================================ */
.homepage-banner {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  margin-bottom: clamp(30px, 5vw, 48px);
  padding: clamp(64px, 8vw, 104px) clamp(20px, 5vw, 64px);
  border-radius: 0 0 34px 34px;
  background:
    radial-gradient(
      circle at 82% 18%,
      rgba(142,221,184, 0.16),
      transparent 30%
    ),
    linear-gradient(
      120deg,
      rgba(5, 46, 43, 0.99) 0%,
      rgba(6,102,73, 0.97) 56%,
      rgba(24,61,50, 0.99) 100%
    );
  color: #fff;
  text-align: center;
  box-shadow: 0 22px 50px rgba(7, 63, 58, 0.14);
}

.homepage-banner h1 {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto 14px;
  font-size: clamp(2.15rem, 5vw, 4rem);
  font-weight: 850;
  letter-spacing: -0.055em;
  line-height: 1.04;
  text-wrap: balance;
}

.homepage-banner p {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto 28px;
  color: rgba(255, 255, 255, 0.82);
  font-size: clamp(1rem, 1.5vw, 1.15rem);
  line-height: 1.75;
}

/* ===== Product Grid & Cards ===== */
.product-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fill,
    minmax(min(100%, 260px), 1fr)
  );
  gap: clamp(16px, 2.2vw, 24px);
}

.product-card {
  height: 100%;
  overflow: hidden;
  border: 1px solid rgba(131,155,140, 0.2);
  border-radius: var(--sh-radius-lg);
  background: var(--sh-surface);
  box-shadow: var(--sh-shadow-sm);
  cursor: pointer;
  transform: translateZ(0);
  transition:
    transform var(--sh-normal) var(--sh-ease),
    box-shadow var(--sh-normal) var(--sh-ease),
    border-color var(--sh-normal) ease;
}

@media (hover: hover) {
  .product-card:hover {
    transform: translateY(-6px);
    border-color: rgba(8,127,91, 0.22);
    box-shadow: 0 20px 44px rgba(8,127,91, 0.13);
  }
}

.product-card:active {
  transform: translateY(-2px) scale(0.99);
}

.product-card .product-image {
  position: relative;
  min-height: 182px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(
      circle at 75% 20%,
      rgba(185,235,208, 0.5),
      transparent 38%
    ),
    linear-gradient(135deg, #D8F3E5, #D8F3E5);
  color: var(--sh-primary-600);
  font-size: 56px;
}

.product-card .product-image::after {
  content: "";
  position: absolute;
  right: -45px;
  bottom: -50px;
  width: 110px;
  height: 110px;
  border: 1px solid rgba(8,127,91, 0.15);
  border-radius: 50%;
}

.product-card .MuiCardContent-root,
.product-card .product-details {
  padding: 20px;
}

.product-card .product-details h3 {
  margin-bottom: 8px;
  color: var(--sh-ink);
  font-size: 1.02rem;
  font-weight: 750;
  line-height: 1.4;
}

.product-card .product-details .price {
  margin-bottom: 7px;
  color: var(--sh-primary-700);
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.025em;
}

.product-card .product-details .stock,
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 28px;
  padding: 5px 10px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 750;
  line-height: 1;
}

.stock-available {
  color: #066649;
  background: #D8F3E5;
  border-color: #a7f3d0;
}

.stock-low {
  color: #b45309;
  background: #fffbeb;
  border-color: #fde68a;
}

.stock-out {
  color: #b91c1c;
  background: #fef2f2;
  border-color: #fecaca;
}

/* ===== Promo Banner ===== */
.promo-banner {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
  padding: 20px 24px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: var(--sh-radius-lg);
  background: linear-gradient(
    130deg,
    #f59e0b 0%,
    #f97316 52%,
    #f43f5e 100%
  );
  color: #fff;
  box-shadow: 0 12px 30px rgba(245, 158, 11, 0.2);
  transition:
    transform var(--sh-normal) var(--sh-ease),
    box-shadow var(--sh-normal) var(--sh-ease);
}

.promo-banner::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: -55px;
  right: -35px;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255, 255, 255, 0.28) 0%,
    transparent 68%
  );
}

@media (hover: hover) {
  .promo-banner:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 38px rgba(245, 158, 11, 0.25);
  }
}

.promo-banner .discount-badge {
  flex-shrink: 0;
  padding: 7px 14px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.2);
  font-size: 0.84rem;
  font-weight: 800;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* ===== Login ===== */
.login-container {
  width: min(calc(100% - 32px), 460px);
  margin: clamp(36px, 8vh, 72px) auto;
  padding: clamp(28px, 4vw, 42px);
  border-radius: var(--sh-radius-xl);
  box-shadow: var(--sh-shadow-lg);
  animation: fadeInUp 0.5s var(--sh-ease) both;
}

.login-container::before {
  content: "";
  display: block;
  width: 54px;
  height: 5px;
  margin: -6px auto 22px;
  border-radius: 999px;
  background: linear-gradient(
    90deg,
    var(--sh-primary-700),
    var(--sh-primary-300)
  );
}

.login-container h2 {
  margin-bottom: 26px;
  color: var(--sh-ink);
  text-align: center;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.login-container .MuiTextField-root {
  margin-bottom: 17px;
}

.login-container .MuiOutlinedInput-root {
  border-radius: 12px;
  transition: box-shadow var(--sh-fast) ease;
}

.login-container .MuiOutlinedInput-root.Mui-focused {
  box-shadow: 0 0 0 4px rgba(142,221,184, 0.12);
}

/* ===== Receipts ===== */
.receipt-item {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 8px;
  border-bottom: 1px dashed #cbd5e1;
  border-radius: 8px;
  transition: background-color var(--sh-fast) ease;
}

.receipt-item:hover {
  background-color: rgba(8,127,91, 0.045);
}

.receipt-total {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 2px solid var(--sh-ink);
  color: var(--sh-primary-700);
  font-size: clamp(1.2rem, 2vw, 1.45rem);
  font-weight: 850;
  letter-spacing: -0.025em;
  text-align: right;
}

/* ===== Charts ===== */
.chart-container {
  margin-bottom: 24px;
  padding: clamp(18px, 2.5vw, 26px);
  border-radius: var(--sh-radius-lg);
  transition:
    transform var(--sh-normal) var(--sh-ease),
    box-shadow var(--sh-normal) var(--sh-ease),
    border-color var(--sh-normal) ease;
}

/* ===== Quick Actions ===== */
.quick-action-card {
  min-height: 150px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 24px;
  border-radius: var(--sh-radius-lg);
  text-align: center;
  cursor: pointer;
  transition:
    transform var(--sh-normal) var(--sh-ease),
    box-shadow var(--sh-normal) var(--sh-ease);
}

@media (hover: hover) {
  .quick-action-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 14px 30px rgba(24,61,50, 0.08);
  }
}

/* ===== Page Header ===== */
.page-header {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
  padding: clamp(24px, 3vw, 32px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--sh-radius-xl);
  background: linear-gradient(
    125deg,
    var(--sh-primary-800) 0%,
    var(--sh-primary-600) 58%,
    #183D32 115%
  );
  color: #fff;
  box-shadow: 0 16px 38px rgba(8,127,91, 0.16);
  animation: fadeInUp 0.48s var(--sh-ease) both;
}

.page-header::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: -85px;
  right: -70px;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(200,238,217, 0.26) 0%,
    transparent 68%
  );
}

.page-header .page-header-icon {
  flex-shrink: 0;
  width: 68px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.page-header .page-header-icon .MuiSvgIcon-root {
  font-size: 38px;
  color: var(--sh-primary-300);
}

.page-header h1,
.page-header .page-header-title {
  margin: 0;
  font-size: clamp(1.5rem, 3vw, 1.9rem);
  font-weight: 850;
  line-height: 1.2;
  letter-spacing: -0.035em;
}

.page-header p,
.page-header .page-header-subtitle {
  max-width: 760px;
  margin: 5px 0 0;
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.98rem;
  line-height: 1.55;
}

/* ===== Greeting Banner ===== */
.greeting-banner {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  margin-bottom: 30px;
  padding: clamp(26px, 4vw, 38px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--sh-radius-xl);
  background: linear-gradient(
    122deg,
    #183D32 0%,
    var(--sh-primary-800) 56%,
    var(--sh-primary-600) 118%
  );
  color: #fff;
  box-shadow: 0 18px 42px rgba(8,127,91, 0.16);
  animation: fadeInUp 0.5s var(--sh-ease) both;
}

.greeting-banner::after {
  content: "";
  position: absolute;
  z-index: -1;
  right: -55px;
  bottom: -100px;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255, 255, 255, 0.14) 0%,
    transparent 70%
  );
}

.greeting-banner h2 {
  position: relative;
  z-index: 1;
  margin: 0 0 7px;
  font-size: clamp(1.65rem, 3vw, 2.1rem);
  font-weight: 850;
  letter-spacing: -0.04em;
  line-height: 1.18;
}

.greeting-banner p {
  position: relative;
  z-index: 1;
  max-width: 780px;
  margin: 0;
  color: rgba(255, 255, 255, 0.8);
  font-size: 1rem;
}

/* ===== Glass Surface ===== */
.glass-card {
  border: 1px solid rgba(255, 255, 255, 0.72);
  border-radius: var(--sh-radius-xl);
  background: rgba(255, 255, 255, 0.74);
  box-shadow: 0 14px 36px rgba(24,61,50, 0.08);
  backdrop-filter: blur(16px) saturate(130%);
  -webkit-backdrop-filter: blur(16px) saturate(130%);
}

/* ===== Empty State ===== */
.empty-state {
  max-width: 620px;
  margin-inline: auto;
  padding: clamp(36px, 6vw, 56px) 24px;
  text-align: center;
}

.empty-state .empty-state-icon {
  width: 92px;
  height: 92px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  border-radius: 28px;
  background: linear-gradient(
    145deg,
    var(--sh-primary-50),
    var(--sh-primary-100)
  );
  color: var(--sh-primary-600);
  font-size: 58px;
  box-shadow: inset 0 0 0 1px rgba(8,127,91, 0.1);
  animation: floatIcon 3.4s ease-in-out infinite;
}

.empty-state h3 {
  margin-bottom: 8px;
  color: var(--sh-text);
  font-size: 1.22rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.empty-state p {
  max-width: 500px;
  margin: 0 auto 18px;
  color: var(--sh-muted);
  font-size: 0.98rem;
  line-height: 1.65;
}

/* ===== Stock Management Table ===== */
.table-container {
  width: 100%;
  overflow-x: auto;
  border-radius: var(--sh-radius-lg);
}

.data-table {
  width: 100%;
  min-width: 680px;
  border-collapse: separate;
  border-spacing: 0;
}

.data-table th,
.data-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--sh-line-soft);
  text-align: left;
}

.data-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #F7F5EC;
  color: #4C695A;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.data-table tbody tr {
  transition: background-color var(--sh-fast) ease;
}

@media (hover: hover) {
  .data-table tbody tr:hover {
    background: #f7fffd;
  }
}

.data-table tbody tr:last-child td {
  border-bottom: 0;
}

.search-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.search-toolbar > * {
  min-width: 0;
}

/* ===== MUI Global Polish =====
   Intentionally NO !important so component-level sx can still win.
   ================================================================ */
.MuiButton-root {
  text-transform: none;
  letter-spacing: -0.01em;
}

.MuiChip-root {
  letter-spacing: 0;
}

.MuiPaper-root {
  background-image: none;
}

.MuiTooltip-tooltip {
  border-radius: 8px;
  font-size: 0.78rem;
}

.MuiCard-root {
  background-image: none;
}

/* ===== Animations ===== */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes floatIcon {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-7px);
  }
}

@keyframes pulse {
  0%,
  100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.035);
  }
}

.animate-fade-in {
  animation: fadeIn 0.45s ease both;
}

.animate-fade-in-up {
  animation: fadeInUp 0.5s var(--sh-ease) both;
}

.animate-pulse {
  animation: pulse 2.2s ease-in-out infinite;
}

.animate-delay-1 {
  animation-delay: 0.08s;
}
.animate-delay-2 {
  animation-delay: 0.16s;
}
.animate-delay-3 {
  animation-delay: 0.24s;
}
.animate-delay-4 {
  animation-delay: 0.32s;
}
.animate-delay-5 {
  animation-delay: 0.4s;
}

/* ===== Responsive ===== */
@media (min-width: 900px) {
  .dashboard-hero {
    padding: 36px;
    border-radius: 26px;
  }
}

@media (max-width: 768px) {
  .product-grid {
    grid-template-columns: 1fr;
  }

  .homepage-banner {
    padding: 58px 18px;
    border-radius: 0 0 24px 24px;
  }

  .page-container {
    padding: 22px 15px;
  }

  .page-header {
    align-items: flex-start;
    gap: 14px;
    padding: 22px;
  }

  .page-header .page-header-icon {
    width: 58px;
    height: 58px;
    border-radius: 16px;
  }

  .greeting-banner {
    padding: 26px 22px;
  }

  .promo-banner {
    align-items: flex-start;
  }

  .search-toolbar {
    align-items: stretch;
    flex-direction: column;
  }
}

@media (max-width: 480px) {
  .page-header,
  .promo-banner {
    flex-direction: column;
  }

  .promo-banner .discount-badge {
    align-self: flex-start;
  }

  .product-card .product-image {
    min-height: 160px;
  }

  .login-container {
    width: min(calc(100% - 24px), 460px);
    margin: 24px auto;
    padding: 28px 22px;
    border-radius: 20px;
  }

  .receipt-item {
    gap: 10px;
    font-size: 0.92rem;
  }
}

/* ===== Accessibility ===== */
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Shared frosted controls; semantic alerts keep their status colors. */
.MuiOutlinedInput-root {
  background-color: var(--sh-glass-bg);
}

.MuiTableContainer-root {
  background-color: var(--sh-glass-bg);
}

.MuiTableCell-stickyHeader {
  background-color: var(--sh-glass-raised);
}

.product-card,
.dashboard-hero,
.page-header,
.greeting-banner {
  backdrop-filter: blur(16px) saturate(125%);
  -webkit-backdrop-filter: blur(16px) saturate(125%);
}

@media print {
  body { background: white; }
  :root {
    --sh-glass-bg: #fff;
    --sh-glass-raised: #fff;
    --sh-page-tint: #fff;
  }
  .MuiPaper-root, .glass-card, .card, .table-container {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    box-shadow: none;
  }
}

/* ===== Backdrop Filter Fallback ===== */
@supports not (
  (backdrop-filter: blur(1px)) or
    (-webkit-backdrop-filter: blur(1px))
) {
  :root {
    --sh-glass-bg: #F9FAF0;
    --sh-glass-raised: #F9FAF0;
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.94);
  }

  .page-header .page-header-icon,
  .promo-banner .discount-badge {
    background: rgba(255, 255, 255, 0.18);
  }
}
